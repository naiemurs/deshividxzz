<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0b0f16">
    <title>Movie Box - Streaming Platform</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- HLS.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        body {
            background-color: #0b0f16; color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            overflow-x: hidden;
        }
        
        .app-container {
            width: 100%; max-width: 1280px; margin: 0 auto;
            background-color: #0b0f16; min-height: 100vh;
            position: relative; box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .nav-active { color: #00d27a !important; }
        .snap-x { scroll-snap-type: x mandatory; }
        .snap-center { scroll-snap-align: center; }

        /* =========================================
           ULTIMATE PLAYER STYLES
           ========================================= */
        #video-wrapper:fullscreen, #video-wrapper:-webkit-full-screen {
            width: 100vw !important; height: 100vh !important;
            max-width: none !important; max-height: none !important;
            border-radius: 0 !important; background-color: #000;
        }

        /* Hide all native controls */
        video::-webkit-media-controls { display: none !important; }
        video::-webkit-media-controls-enclosure { display: none !important; }
        video { outline: none; }

        /* Custom Progress Bar (Touchable) */
        input[type=range] { 
            -webkit-appearance: none; width: 100%; background: transparent; 
            cursor: pointer; pointer-events: auto; z-index: 60; margin: 0; padding: 10px 0;
        }
        input[type=range]:focus { outline: none; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%;
            background: #00d27a; cursor: pointer; margin-top: -6px; box-shadow: 0 0 8px rgba(0,210,122,0.8);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px; cursor: pointer; background: rgba(255, 255, 255, 0.3); border-radius: 2px;
        }

        /* Floating Settings Buttons */
        .player-float-btn {
            background: rgba(0, 0, 0, 0.7); border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50%; color: #fff; cursor: pointer; backdrop-filter: blur(10px);
            width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
            transition: 0.2s; pointer-events: auto; z-index: 50;
        }
        .player-float-btn:hover, .player-float-btn:active { background: rgba(0,210,122,0.2); color: #00d27a; border-color: #00d27a; }

        #custom-controls { transition: opacity 0.3s ease; }
        #gesture-layer { touch-action: none; } /* Prevents page scroll when swiping video */
    </style>
</head>
<body class="flex justify-center bg-gray-900">

    <div class="app-container flex flex-col" id="main-app-container">

        <!-- ==========================================
             HOME VIEW
        =========================================== -->
        <div id="home-view" class="flex-1 pb-24 overflow-y-auto">
            <header class="pt-4 pb-2 px-4 sticky top-0 bg-[#0b0f16]/95 backdrop-blur-md z-40">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-green-400 to-blue-500 flex items-center justify-center shrink-0 shadow-lg">
                        <i class="fa-solid fa-play text-white text-xs ml-0.5"></i>
                    </div>
                    <div class="flex-1 bg-[#1a1f29] rounded-full flex items-center px-4 py-2 border border-gray-800 max-w-2xl">
                        <i class="fa-solid fa-magnifying-glass text-gray-500 text-sm mr-2"></i>
                        <input type="text" placeholder="Search movies, series..." class="bg-transparent border-none outline-none text-sm text-gray-200 w-full placeholder-gray-500">
                    </div>
                </div>
                <nav class="flex items-center gap-5 mt-4 overflow-x-auto no-scrollbar text-[15px] font-medium text-gray-400 border-b border-gray-800 pb-1">
                    <a href="#" class="text-white font-bold whitespace-nowrap shrink-0 relative pb-1">Trending<span class="absolute bottom-0 left-1/2 -translate-x-1/2 w-5 h-[3px] bg-white rounded-full"></span></a>
                    <a href="#" class="whitespace-nowrap shrink-0 hover:text-white transition">Movie</a>
                    <a href="#" class="whitespace-nowrap shrink-0 hover:text-white transition">TV Series</a>
                </nav>
            </header>

            <main>
                <!-- Hero Banner Carousel -->
                <section class="mt-2 md:mt-4 w-full overflow-hidden md:px-4">
                    <div class="flex overflow-x-auto snap-x no-scrollbar w-full md:rounded-2xl" id="hero-carousel">
                        
                        <!-- Hero Item 1: MP4 Test (100% Works) -->
                        <div class="relative w-full shrink-0 snap-center aspect-[4/3] sm:aspect-video md:aspect-[3/1] lg:aspect-[4/1] cursor-pointer bg-black overflow-hidden" onclick="openPlayer(999)">
                            <img src="https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=800&q=80" loading="lazy" class="absolute inset-0 w-full h-full object-cover opacity-30 blur-2xl scale-125">
                            <div class="absolute inset-0 w-full h-full flex justify-center items-center z-10 py-0 md:py-4">
                                <img src="https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=800&q=80" loading="lazy" class="w-full h-full object-cover md:object-contain md:rounded-lg shadow-2xl">
                            </div>
                            <div class="absolute inset-0 bg-gradient-to-t from-[#0b0f16] via-[#0b0f16]/30 to-transparent z-10"></div>
                            <div class="absolute bottom-4 left-0 w-full px-4 flex gap-3 md:max-w-md z-20">
                                <div class="bg-[#1a1f29]/90 backdrop-blur-md rounded-xl p-2 flex items-center gap-3 w-full border border-gray-700/50 shadow-lg">
                                    <div class="w-10 h-14 rounded-lg bg-green-500 flex items-center justify-center font-bold text-xs text-center p-1">Test</div>
                                    <div class="flex-1"><h4 class="text-sm font-semibold truncate text-green-400">MP4 Test Video</h4></div>
                                    <div class="w-8 h-8 rounded-full bg-green-500 flex items-center justify-center text-white text-xs shrink-0"><i class="fa-solid fa-play ml-0.5"></i></div>
                                </div>
                            </div>
                        </div>

                        <!-- Hero Item 2: Irumudi -->
                        <div class="relative w-full shrink-0 snap-center aspect-[4/3] sm:aspect-video md:aspect-[3/1] lg:aspect-[4/1] cursor-pointer bg-black overflow-hidden" onclick="openPlayer(9)">
                            <img src="https://image.tmdb.org/t/p/w600_and_h900_bestv2/y0huHbMUwEkp0ETChWLOD8MriNr.jpg" loading="lazy" class="absolute inset-0 w-full h-full object-cover opacity-30 blur-2xl scale-125">
                            <div class="absolute inset-0 w-full h-full flex justify-center items-center z-10 py-0 md:py-4">
                                <img src="https://image.tmdb.org/t/p/w600_and_h900_bestv2/y0huHbMUwEkp0ETChWLOD8MriNr.jpg" loading="lazy" class="w-full h-full object-cover md:object-contain md:rounded-lg md:shadow-2xl">
                            </div>
                            <div class="absolute inset-0 bg-gradient-to-t from-[#0b0f16] via-[#0b0f16]/30 to-transparent z-10"></div>
                            <div class="absolute bottom-4 left-0 w-full px-4 flex gap-3 md:max-w-md z-20">
                                <div class="bg-[#1a1f29]/90 backdrop-blur-md rounded-xl p-2 flex items-center gap-3 w-full border border-gray-700/50 shadow-lg">
                                    <img src="https://image.tmdb.org/t/p/w600_and_h900_bestv2/y0huHbMUwEkp0ETChWLOD8MriNr.jpg" class="w-10 h-14 rounded-lg object-cover">
                                    <div class="flex-1"><h4 class="text-sm font-semibold truncate">Irumudi (2026)</h4></div>
                                    <div class="w-8 h-8 rounded-full bg-green-500 flex items-center justify-center text-white text-xs shrink-0"><i class="fa-solid fa-play ml-0.5"></i></div>
                                </div>
                            </div>
                        </div>

                    </div>
                </section>
                
                <!-- Trending Movies Section -->
                <section class="mt-6 pb-2">
                    <div class="flex items-center justify-between px-4 mb-4">
                        <h2 class="text-lg md:text-xl font-bold border-l-4 border-green-500 pl-2">Trending Movies</h2>
                    </div>
                    <div id="movie-list-container" class="flex gap-4 px-4 overflow-x-auto no-scrollbar pb-2"></div>
                </section>

            </main>
        </div>

        <!-- ==========================================
             DOWNLOADS VIEW
        =========================================== -->
        <div id="downloads-view" class="hidden flex-1 pb-24 overflow-y-auto">
            <header class="pt-6 pb-4 px-4 sticky top-0 bg-[#0b0f16]/95 backdrop-blur-md z-40 border-b border-gray-800">
                <h1 class="text-2xl font-bold">My Downloads</h1>
            </header>
            <main class="p-4 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="downloaded-items-container"></main>
        </div>

        <!-- ==========================================
             BOTTOM NAVIGATION
        =========================================== -->
        <nav class="fixed bottom-0 w-full max-w-[1280px] bg-[#111620]/95 backdrop-blur-lg border-t border-gray-800 flex justify-around py-3 px-2 z-50">
            <a href="#" onclick="switchTab('home-view')" id="nav-home" class="nav-active flex flex-col items-center gap-1 text-gray-500 hover:text-[#00d27a] transition w-full">
                <i class="fa-solid fa-house text-xl"></i>
                <span class="text-[10px] md:text-xs font-medium">Home</span>
            </a>
            <a href="#" onclick="switchTab('downloads-view')" id="nav-downloads" class="flex flex-col items-center gap-1 text-gray-500 hover:text-[#00d27a] transition w-full">
                <i class="fa-solid fa-arrow-down-to-bracket text-xl relative">
                    <span id="dl-badge" class="hidden absolute -top-1 -right-2 bg-red-500 text-white text-[8px] font-bold px-1 rounded-full animate-bounce">New</span>
                </i>
                <span class="text-[10px] md:text-xs font-medium">Downloads</span>
            </a>
        </nav>

        <!-- ==========================================
             VIDEO PLAYER UI (ULTIMATE FIX)
        =========================================== -->
        <div id="player-view" class="hidden flex-1 flex-col bg-[#0b0f16] min-h-screen pb-10 relative">
            
            <!-- Player Wrapper -->
            <section id="video-wrapper" class="w-full bg-black relative flex-shrink-0" style="aspect-ratio: 16/9; max-height: 100vh; margin: 0 auto;">
                
                <!-- Native Video Element -->
                <video id="live-player" class="absolute inset-0 w-full h-full" style="object-fit: contain;" playsinline></video>
                
                <!-- Loading Indicator -->
                <div id="playerLoading" class="hidden absolute inset-0 z-40 flex items-center justify-center pointer-events-none">
                    <i class="fa-solid fa-circle-notch fa-spin text-5xl text-[#00d27a] drop-shadow-lg"></i>
                </div>

                <!-- Player Error Message -->
                <div id="playerError" class="hidden absolute inset-0 bg-black/90 z-[100] flex-col items-center justify-center text-white p-4 text-center pointer-events-auto">
                    <i class="fa-solid fa-triangle-exclamation text-5xl text-yellow-500 mb-3"></i>
                    <p class="mb-2 text-lg font-bold">ভিডিওটি প্লে করা যাচ্ছে না!</p>
                    <p class="mb-4 text-sm text-gray-400">এই ফাইলের ফরম্যাট (.mkv/.hevc) আপনার ব্রাউজার সাপোর্ট করে না।</p>
                    <button onclick="goBack()" class="bg-[#00d27a] text-black px-6 py-2 rounded-full font-bold shadow-lg">ফিরে যান</button>
                </div>

                <!-- OSD Indicators (Center popup for volume/stretch) -->
                <div id="action-indicator" class="hidden absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-black/80 text-white px-6 py-4 rounded-xl z-[60] items-center gap-3 text-2xl font-bold shadow-2xl pointer-events-none"></div>

                <!-- GESTURE LAYER (Z-index 10, beneath controls) -->
                <div id="gesture-layer" class="absolute inset-0 z-10 cursor-pointer touch-none"></div>

                <!-- CUSTOM CONTROLS OVERLAY (Z-index 20) -->
                <div id="custom-controls" class="absolute inset-0 z-20 flex flex-col justify-between opacity-100 transition-opacity duration-300 pointer-events-none">
                    
                    <!-- TOP BAR -->
                    <div class="w-full flex items-center p-4 pt-4 bg-gradient-to-b from-black/90 to-transparent pointer-events-auto">
                        <button onclick="goBack()" class="text-white hover:text-[#00d27a] p-2 text-2xl transition drop-shadow mr-2"><i class="fa-solid fa-arrow-left"></i></button>
                        <span id="player-title-top" class="text-base sm:text-lg font-bold text-white drop-shadow-md truncate">Loading...</span>
                    </div>

                    <!-- CENTER PLAY/PAUSE -->
                    <div class="flex-1 flex items-center justify-center pointer-events-none">
                        <button id="center-play-btn" class="pointer-events-auto text-white transform hover:scale-110 transition w-24 h-24 flex items-center justify-center drop-shadow-2xl z-[25]" onclick="togglePlay()">
                            <i id="center-play-icon" class="fa-solid fa-play text-6xl md:text-7xl opacity-90 hover:opacity-100"></i>
                        </button>
                    </div>

                    <!-- BOTTOM BAR -->
                    <!-- pointer-events-auto is CRITICAL here so touches don't pass through to gesture-layer -->
                    <div class="w-full bg-gradient-to-t from-black via-black/80 to-transparent px-4 pb-4 pt-20 relative pointer-events-auto">
                        
                        <!-- Floating Setting Buttons (Absolute right) -->
                        <div class="absolute right-4 bottom-[70px] flex gap-3 z-50">
                            <button class="player-float-btn" onclick="cycleStretch()" title="Aspect Ratio"><i id="stretch-icon" class="fa-solid fa-crop-simple"></i></button>
                            <button class="player-float-btn" onclick="toggleFullscreen()" title="Fullscreen"><i id="fullscreen-icon" class="fa-solid fa-expand"></i></button>
                        </div>

                        <!-- Timeline & Progress Row -->
                        <div class="flex items-center gap-3 w-full bg-black/40 p-2 rounded-xl backdrop-blur-md border border-white/10 z-50">
                            <button onclick="togglePlay()" class="text-white hover:text-[#00d27a] transition text-xl w-8 flex justify-center"><i id="bottom-play-icon" class="fa-solid fa-play"></i></button>
                            <span id="current-time" class="text-xs sm:text-sm text-white/90 font-medium w-12 text-right">00:00</span>
                            
                            <!-- The Seek Bar -->
                            <input type="range" id="progress-bar" class="flex-1" value="0" step="0.1">
                            
                            <span id="duration-time" class="text-xs sm:text-sm text-white/90 font-medium w-12">00:00</span>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Video Information Section -->
            <div class="flex-1 overflow-y-auto" id="info-section-wrapper">
                <section class="p-4 max-w-4xl mx-auto" id="info-section">
                    <div>
                        <h1 id="player-title" class="text-2xl md:text-3xl font-bold mb-2">Title</h1>
                        <div class="flex flex-wrap items-center gap-2 text-xs md:text-sm text-gray-400 font-medium mb-4">
                            <span id="player-kdrama-badge" class="hidden bg-rose-600 text-white px-2 py-0.5 rounded text-[10px] md:text-xs font-bold tracking-wider">KDRAMA</span>
                            <span class="text-amber-500"><i class="fa-solid fa-star text-[10px] md:text-xs"></i> <span id="player-rating">0.0</span></span>
                            <span>|</span><span id="player-year">YYYY</span>
                            <span>|</span><span id="player-genre">Category</span>
                        </div>
                        <p id="player-desc" class="text-sm text-gray-400 mb-6"></p>
                    </div>

                    <div class="grid grid-cols-4 md:flex md:gap-4 gap-2 border-b border-gray-800 pb-5">
                        <button class="bg-[#1c212a] hover:bg-gray-700 text-gray-200 py-2 rounded-lg text-[11px] md:text-sm font-medium flex flex-col items-center justify-center gap-1.5 transition">
                            <i class="fa-solid fa-plus text-sm"></i> Add to list
                        </button>
                        <button onclick="shareLink()" class="bg-[#1c212a] hover:bg-gray-700 text-gray-200 py-2 rounded-lg text-[11px] md:text-sm font-medium flex flex-col items-center justify-center gap-1.5 transition">
                            <i class="fa-solid fa-share-nodes text-sm"></i> Share
                        </button>
                        <button onclick="startDownload()" class="bg-[#1c212a] text-[#00d27a] py-2 rounded-lg text-[11px] md:text-sm font-bold flex flex-col items-center justify-center gap-1.5 border border-[#00d27a]/30">
                            <i class="fa-solid fa-download text-sm"></i> Download
                        </button>
                        <button onclick="switchTab('downloads-view')" class="bg-[#1c212a] hover:bg-gray-700 text-gray-200 py-2 rounded-lg text-[11px] md:text-sm font-medium flex flex-col items-center justify-center gap-1.5 transition">
                            <i class="fa-solid fa-file-arrow-down text-sm"></i> View Dls
                        </button>
                    </div>

                    <div class="pt-4 pb-2 border-b border-gray-800">
                        <div class="flex items-center gap-2 mb-4">
                            <h3 class="font-bold text-lg md:text-xl">Episodes</h3>
                        </div>
                        <div id="episodes-container" class="mt-4">
                            <div id="episodes-list" class="grid grid-cols-3 sm:grid-cols-6 md:grid-cols-8 gap-2.5"></div>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </div>

    <!-- ==========================================
         JAVASCRIPT DATA & LOGIC
    =========================================== -->
    <script>
        // Database
        const contentData = [
            {
                id: 999,
                title: "Test Video (MP4 Format)", type: "movie", isKDrama: false,
                poster: "https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=800&q=80",
                rating: "10/10", year: "2026", genre: "Testing, Standard",
                desc: "This is a standard MP4 video to prove that the player works perfectly.",
                episodes: [
                    { epNum: "Play MP4 (Works)", link: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" }
                ]
            },
            {
                id: 9,
                title: "Irumudi (2026)", type: "movie", isKDrama: false,
                poster: "https://image.tmdb.org/t/p/w600_and_h900_bestv2/y0huHbMUwEkp0ETChWLOD8MriNr.jpg",
                rating: "N/A", year: "2026", genre: "Action, Drama",
                desc: "Irumudi (2026) DS4K WEB-DL [Hindi-Telugu]",
                episodes: [
                    { epNum: "Watch Movie", link: "https://pub-f332b841dcd645d494b56b96216bdc45.r2.dev/CINEFREAK.TOP%20-%20Irumudi%20%282026%29%20DS4K%20WEB-DL%20%5BHindi-Telugu%5D%20720p%20HEVC%20ESub.mkv" }
                ]
            },
            {
                id: 8,
                title: "Lust Stories 3 (2026)", type: "movie", isKDrama: false,
                poster: "https://image.tmdb.org/t/p/w600_and_h900_bestv2/1GBe4TeCeXa1ENg0rv2JH8cH0ry.jpg",
                rating: "N/A", year: "2026", genre: "Romance, Drama",
                desc: "Lust Stories 3 (2026) DS4K WEB-DL [Hindi]",
                episodes: [
                    { epNum: "Watch Movie", link: "https://pub-e2976e423f3545829ba627b7ab84b5a6.r2.dev/CINEFREAK.TOP%20-%20Lust%20Stories-3%20(2026)%20DS4K%20WEB-DL%20[Hindi]%20720p%20HEVC%20ESub.mkv" }
                ]
            },
            {
                id: 7,
                title: "Bachelor Point", type: "series", isKDrama: false,
                poster: "https://pub-69b6234af505413bbeac2bbc8039195c.r2.dev/poster_wm7n1787231362.jpg",
                rating: "8.5/10", year: "2026", genre: "Comedy, Drama",
                desc: "A story of friends living together in a bachelor point.",
                episodes: [
                    { epNum: "105-112", link: "https://pub-538edaef4a1246c989cd0c69ae08ce40.r2.dev/media/csYdVqmU/main?token=1787270400-45d2a0bfe7e8bb8902f136896c3b20e3778a52e3" }
                ]
            }
        ];

        let currentActiveItem = null, currentEpIndex = 0, previousView = 'home-view';
        let slideInterval;
        let currentSlide = 0;

        function startAutoSlide() {
            clearInterval(slideInterval); 
            slideInterval = setInterval(() => {
                currentSlide = (currentSlide + 1) % 2;
                document.getElementById('hero-carousel').scrollTo({ left: document.getElementById('hero-carousel').clientWidth * currentSlide, behavior: 'smooth' });
            }, 3500); 
        }

        function switchTab(viewId) {
            ['home-view', 'downloads-view', 'player-view'].forEach(id => document.getElementById(id).classList.add('hidden'));
            document.getElementById(viewId).classList.remove('hidden');
            window.scrollTo(0, 0);

            document.getElementById('nav-home').classList.remove('nav-active');
            document.getElementById('nav-downloads').classList.remove('nav-active');
            
            if(viewId === 'home-view') {
                document.getElementById('nav-home').classList.add('nav-active');
                startAutoSlide(); 
            } else {
                clearInterval(slideInterval); 
            }
            if(viewId === 'downloads-view') {
                document.getElementById('nav-downloads').classList.add('nav-active');
                loadDownloads();
            }
            if(viewId !== 'player-view') { closePlayerLogic(); }
        }

        function renderContent() {
            const movieContainer = document.getElementById('movie-list-container');
            movieContainer.innerHTML = '';
            
            contentData.forEach((item) => {
                const cardHTML = `
                <div onclick="openPlayer(${item.id}, 'home-view')" class="relative w-[130px] shrink-0 cursor-pointer group">
                    <div class="relative aspect-[2/3] rounded-lg overflow-hidden bg-gray-900 border border-gray-800">
                        <img src="${item.poster}" class="w-full h-full object-cover">
                        <div class="absolute top-1 right-1 bg-black/60 text-[10px] px-1.5 py-0.5 rounded text-gray-200">Movie</div>
                    </div>
                    <h3 class="text-sm font-medium mt-2 truncate text-gray-200">${item.title}</h3>
                </div>`;
                movieContainer.innerHTML += cardHTML;
            });
            startAutoSlide(); 
        }

        function openPlayer(id, fromView = 'home-view') {
            previousView = fromView;
            currentActiveItem = contentData.find(item => item.id === id);
            
            document.getElementById('player-title').innerText = currentActiveItem.title;
            document.getElementById('player-desc').innerText = currentActiveItem.desc || "";
            document.getElementById('live-player').poster = currentActiveItem.poster;

            const epList = document.getElementById('episodes-list');
            epList.innerHTML = '';
            currentActiveItem.episodes.forEach((ep, index) => {
                const btnClass = index === 0 ? 'border border-[#00d27a] text-[#00d27a] bg-[#00d27a]/10' : 'bg-[#1c212a] text-gray-400';
                epList.innerHTML += `<button onclick="playEpisode(${index}, this)" class="ep-btn w-full h-10 px-2 rounded text-sm font-medium ${btnClass} transition truncate">${ep.epNum}</button>`;
            });

            switchTab('player-view');
            playEpisode(0, null);
        }

        // =========================================
        // PLAYER CORE, FULLSCREEN, STRETCH & SEEK
        // =========================================
        const video = document.getElementById('live-player');
        const pWrapper = document.getElementById('video-wrapper');
        const controlsOverlay = document.getElementById('custom-controls');
        const actionIndicator = document.getElementById('action-indicator');
        const playerLoading = document.getElementById('playerLoading');
        const playerError = document.getElementById('playerError');
        const progressBar = document.getElementById('progress-bar');
        
        let hls = null;
        let playerIdleTimer;
        let isDraggingRange = false;

        function playEpisode(index, btnElement) {
            currentEpIndex = index;
            const src = currentActiveItem.episodes[index].link;
            
            if(btnElement) {
                document.querySelectorAll('.ep-btn').forEach(b => b.className = 'ep-btn w-full h-10 px-2 rounded text-sm font-medium bg-[#1c212a] text-gray-400 transition truncate');
                btnElement.className = 'ep-btn w-full h-10 px-2 rounded text-sm font-medium border border-[#00d27a] text-[#00d27a] bg-[#00d27a]/10 transition truncate';
            }
            
            let epText = currentActiveItem.type === 'series' ? ` - ${currentActiveItem.episodes[index].epNum}` : "";
            document.getElementById('player-title-top').innerText = `${currentActiveItem.title}${epText}`;
            
            setupPlayerCore(src);
        }

        function goBack() {
            // Exit fullscreen if active before going back
            if (document.fullscreenElement || document.webkitFullscreenElement) {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            }
            switchTab(previousView);
        }

        function closePlayerLogic() {
            video.pause();
            video.removeAttribute('src');
            video.load();
            if (hls) { hls.destroy(); hls = null; }
            clearTimeout(playerIdleTimer);
            controlsOverlay.classList.remove('opacity-0'); 
            playerLoading.classList.add('hidden');
            playerError.classList.add('hidden');
            updatePlayPauseUI(false);
        }

        // --- FULLSCREEN LOGIC (GUARANTEED FOR MOBILE) ---
        window.toggleFullscreen = function() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                // Try to make the wrapper fullscreen
                if (pWrapper.requestFullscreen) {
                    pWrapper.requestFullscreen();
                } else if (pWrapper.webkitRequestFullscreen) {
                    pWrapper.webkitRequestFullscreen();
                } else if (video.webkitEnterFullscreen) {
                    // Fallback for iOS Safari which only allows video element fullscreen
                    video.webkitEnterFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
        };
        
        document.addEventListener('fullscreenchange', handleFsChange);
        document.addEventListener('webkitfullscreenchange', handleFsChange);
        function handleFsChange() {
            const isFull = document.fullscreenElement || document.webkitFullscreenElement;
            document.getElementById('fullscreen-icon').className = isFull ? "fa-solid fa-compress" : "fa-solid fa-expand";
        }

        // --- ZOOM / STRETCH LOGIC ---
        const fitModes = ['contain', 'cover', 'fill'];
        const fitNames = ['Best Fit', 'Zoom', 'Stretch'];
        let currentFitIndex = 0;

        window.cycleStretch = function() {
            currentFitIndex = (currentFitIndex + 1) % fitModes.length;
            video.style.objectFit = fitModes[currentFitIndex];
            
            // Update UI
            showIndicator('<i class="fa-solid fa-crop-simple"></i>', fitNames[currentFitIndex]);
            const icon = document.getElementById('stretch-icon');
            if(currentFitIndex === 0) icon.className = "fa-solid fa-crop-simple";
            else if(currentFitIndex === 1) icon.className = "fa-solid fa-magnifying-glass-plus";
            else icon.className = "fa-solid fa-expand";
            
            showControls();
        };

        // --- SEEKING / PROGRESS BAR LOGIC ---
        // Prevent hide UI while interacting with the progress bar
        progressBar.addEventListener('touchstart', () => { isDraggingRange = true; showControls(); }, {passive: true});
        progressBar.addEventListener('mousedown', () => { isDraggingRange = true; showControls(); });

        progressBar.addEventListener('input', (e) => {
            if(video.duration) {
                let time = (e.target.value / 100) * video.duration;
                document.getElementById('current-time').innerText = formatTime(time);
            }
        });

        progressBar.addEventListener('touchend', (e) => {
            if(video.duration) video.currentTime = (e.target.value / 100) * video.duration;
            isDraggingRange = false;
            showControls();
        });
        progressBar.addEventListener('mouseup', (e) => {
            if(video.duration) video.currentTime = (e.target.value / 100) * video.duration;
            isDraggingRange = false;
            showControls();
        });

        video.addEventListener('timeupdate', () => {
            if(!isDraggingRange && video.duration) {
                progressBar.value = (video.currentTime / video.duration) * 100;
                document.getElementById('current-time').innerText = formatTime(video.currentTime);
                document.getElementById('duration-time').innerText = formatTime(video.duration);
            }
        });

        // --- PLAY/PAUSE AND AUTO-HIDE UI ---
        function toggleControls() {
            if (controlsOverlay.classList.contains('opacity-0')) showControls();
            else hideControls();
        }

        function showControls() {
            controlsOverlay.classList.remove('opacity-0');
            clearTimeout(playerIdleTimer);
            if (!video.paused && !isDraggingRange && playerError.classList.contains('hidden')) {
                playerIdleTimer = setTimeout(hideControls, 3500);
            }
        }

        function hideControls() {
            if (!video.paused && !isDraggingRange && playerError.classList.contains('hidden')) {
                controlsOverlay.classList.add('opacity-0');
            }
        }

        function togglePlay() { 
            video.paused ? video.play().catch(e=>console.log(e)) : video.pause(); 
            showControls(); 
        }
        
        function updatePlayPauseUI(isPlaying) {
            document.getElementById('center-play-icon').className = isPlaying ? "hidden" : "fa-solid fa-play text-6xl md:text-7xl opacity-90";
            document.getElementById('bottom-play-icon').className = isPlaying ? "fa-solid fa-pause" : "fa-solid fa-play";
        }

        video.addEventListener('play', () => { updatePlayPauseUI(true); showControls(); playerLoading.classList.add('hidden'); });
        video.addEventListener('pause', () => { updatePlayPauseUI(false); showControls(); });
        video.addEventListener('waiting', () => { playerLoading.classList.remove('hidden'); });
        video.addEventListener('playing', () => { playerLoading.classList.add('hidden'); });

        // Core Player Engine
        function setupPlayerCore(url) {
            playerLoading.classList.remove('hidden');
            playerError.classList.add('hidden');
            showControls();
            
            const isHls = url.includes('.m3u8');

            if (isHls && typeof Hls !== 'undefined' && Hls.isSupported()) {
                if (hls) { hls.destroy(); }
                hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() { 
                    video.play().catch(e=>console.log(e)); 
                    playerLoading.classList.add('hidden'); 
                });
                hls.on(Hls.Events.ERROR, function (event, data) {
                    if (data.fatal) {
                        playerError.classList.remove('hidden');
                        playerError.classList.add('flex');
                        playerLoading.classList.add('hidden');
                    }
                });
            } else {
                if (hls) { hls.destroy(); hls = null; }
                video.src = url;
                video.load();
                video.onerror = function() {
                    playerError.classList.remove('hidden');
                    playerError.classList.add('flex');
                    playerLoading.classList.add('hidden');
                };
                video.play().catch(e => console.log("Direct play wait:", e));
            }
        }

        // --- ADVANCED GESTURES (SWIPE TO SEEK/VOL) ---
        const gestureLayer = document.getElementById('gesture-layer');
        let dragStartX = 0, dragStartY = 0, startVidTime = 0, startVol = 0, dragType = null;
        let gestureActive = false;

        function getX(e) { return e.touches ? e.touches[0].clientX : e.clientX; }
        function getY(e) { return e.touches ? e.touches[0].clientY : e.clientY; }

        gestureLayer.addEventListener('touchstart', (e) => {
            gestureActive = true; dragType = null;
            dragStartX = getX(e); dragStartY = getY(e);
            startVidTime = video.currentTime; startVol = video.volume;
        }, {passive: true});

        gestureLayer.addEventListener('touchmove', (e) => {
            if(!gestureActive || playerError.classList.contains('flex')) return; 
            
            const diffX = getX(e) - dragStartX;
            const diffY = getY(e) - dragStartY;

            if(!dragType) {
                if(Math.abs(diffX) > 15) { dragType = 'seek'; video.pause(); }
                else if (Math.abs(diffY) > 15) { dragType = 'volume'; }
            }

            if(dragType === 'seek') {
                e.preventDefault(); 
                let newTime = startVidTime + (diffX * 0.5); // 0.5s per pixel
                newTime = Math.max(0, Math.min(video.duration || 0, newTime));
                video.currentTime = newTime;
                showIndicator('<i class="fa-solid fa-clock"></i>', formatTime(newTime));
            } else if (dragType === 'volume') {
                e.preventDefault();
                let newVol = startVol - (diffY / 150); 
                newVol = Math.max(0, Math.min(1, newVol));
                video.volume = newVol;
                showIndicator('<i class="fa-solid fa-volume-high"></i>', Math.round(newVol * 100) + '%');
            }
        }, {passive: false});

        gestureLayer.addEventListener('touchend', (e) => {
            if(!gestureActive) return;
            gestureActive = false; 
            actionIndicator.classList.add('hidden'); actionIndicator.classList.remove('flex');
            
            if(dragType === 'seek') { 
                video.play().catch(e=>console.log(e)); 
            } else if (!dragType) {
                toggleControls(); // Tap to toggle UI
            }
            dragType = null;
        });

        // PC Mouse Support
        gestureLayer.addEventListener('mousedown', (e) => {
            gestureActive = true; dragType = null;
            dragStartX = getX(e); dragStartY = getY(e);
            startVidTime = video.currentTime; startVol = video.volume;
        });
        gestureLayer.addEventListener('mousemove', (e) => {
            if(!gestureActive || playerError.classList.contains('flex')) return; 
            const diffX = getX(e) - dragStartX;
            const diffY = getY(e) - dragStartY;
            if(!dragType) {
                if(Math.abs(diffX) > 15) { dragType = 'seek'; video.pause(); }
                else if (Math.abs(diffY) > 15) { dragType = 'volume'; }
            }
            if(dragType === 'seek') {
                let newTime = startVidTime + (diffX * 0.5); 
                newTime = Math.max(0, Math.min(video.duration || 0, newTime));
                video.currentTime = newTime;
                showIndicator('<i class="fa-solid fa-clock"></i>', formatTime(newTime));
            } else if (dragType === 'volume') {
                let newVol = startVol - (diffY / 150); 
                newVol = Math.max(0, Math.min(1, newVol));
                video.volume = newVol;
                showIndicator('<i class="fa-solid fa-volume-high"></i>', Math.round(newVol * 100) + '%');
            }
        });
        gestureLayer.addEventListener('mouseup', () => {
            if(!gestureActive) return;
            gestureActive = false; actionIndicator.classList.add('hidden'); actionIndicator.classList.remove('flex');
            if(dragType === 'seek') video.play().catch(e=>console.log(e));
            else if (!dragType) { toggleControls(); }
            dragType = null;
        });
        gestureLayer.addEventListener('mouseleave', () => { gestureActive = false; actionIndicator.classList.add('hidden'); });

        function showIndicator(iconHtml, text) {
            actionIndicator.innerHTML = `${iconHtml} <span>${text}</span>`;
            actionIndicator.classList.remove('hidden'); actionIndicator.classList.add('flex');
        }

        function formatTime(s) {
            if (isNaN(s)) return "00:00";
            return `${Math.floor(s/60).toString().padStart(2,'0')}:${Math.floor(s%60).toString().padStart(2,'0')}`;
        }

        // Downloads System
        function startDownload() {
            const dlId = `${currentActiveItem.id}_${currentEpIndex}`;
            let downloads = JSON.parse(localStorage.getItem('moviebox_downloads')) || [];
            if (downloads.find(dl => dl.dlId === dlId)) { alert('Already Downloaded!'); return; }
            downloads.push({
                dlId: dlId, movieId: currentActiveItem.id, title: currentActiveItem.title,
                poster: currentActiveItem.poster, link: currentActiveItem.episodes[currentEpIndex].link, size: "450 MB"
            });
            localStorage.setItem('moviebox_downloads', JSON.stringify(downloads));
            alert('Saved to Downloads!');
            document.getElementById('dl-badge').classList.remove('hidden');
        }

        function shareLink() {
            navigator.clipboard.writeText(window.location.href);
            alert('Link Copied!');
        }

        window.onload = renderContent;
    </script>
</body>
</html>
