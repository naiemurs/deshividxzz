<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sports Match Center</title><style>
:root{color-scheme:dark;--bg:#0B101E;--panel:#161A23;--line:#2A3143;--green:#22c55e;--orange:#F05A28}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}header{padding:22px 15px;text-align:center}h1{margin:0;font-size:25px}.sub,.status,footer{color:#9ca3af;font-size:12px;margin-top:8px}.wrap{max-width:1120px;margin:auto;padding:0 12px 30px}.toolbar,.tabs,.controls{display:flex;gap:8px;margin-bottom:12px;align-items:center}.tabs{overflow:auto}button,input,select{background:#161D31;color:white;border:1px solid var(--line);border-radius:10px;padding:10px;font-weight:700}button{cursor:pointer;white-space:nowrap}button.active{background:var(--orange);border-color:var(--orange)}input{flex:1;min-width:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:12px;margin-top:12px}.card{background:var(--panel);border:1.5px solid var(--green);border-radius:14px;overflow:hidden;cursor:pointer;box-shadow:0 4px 15px #0004}.card:active{transform:scale(.99)}.card-header{text-align:center;padding:14px 12px 6px;font-size:11px;color:#d1d5db;font-weight:700;text-transform:uppercase}.card-body{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 18px;gap:6px}.team{display:flex;align-items:center;gap:8px;width:42%;min-width:0}.team.right{flex-direction:row-reverse;text-align:right}.team-name{font-size:13px;font-weight:700;overflow-wrap:anywhere}.logo{width:48px;height:48px;flex:0 0 48px;border-radius:12px;background:white;color:#111;display:grid;place-items:center;padding:5px;font-size:24px}.logo img{width:100%;height:100%;object-fit:contain}.center{text-align:center;font-size:11px;font-weight:700;color:#ef4444;min-width:45px}.dot{display:block;font-size:18px;animation:pulse 1.5s infinite}@keyframes pulse{50%{opacity:.3}}.single{flex:1;width:auto}.empty{grid-column:1/-1;text-align:center;padding:35px;border:1px dashed var(--line);border-radius:14px;color:#9ca3af}.modal{position:fi </style></head><body><header><h1>⚽ Sports Match Center</h1><div class="sub">Live Matches · Willow · Sony · Star Sports</div></header><main class="wrap"><div class="toolbar"><input id="search" type="search" placeholder="ম্যাচ বা চ্যানেল খুঁজুন"><button id="refresh">↻ Refresh</button></div><nav class="tabs" id="tabs"></nav><div class="status" id="status">API থেকে ম্যাচ লোড হচ্ছে...</div><section class="grid" id="matches"></section></main><div class="modal" id="modal" role="dialog" aria-modal="true"><div class="box"><div class="head"><strong id="title">Match Player</strong><button id="close">×</button></div><video id="video" controls playsinline autoplay></video><div class="controls"><button data-engine="auto" class="active">Auto</button><button data-engine="shaka">Shaka Player</button><button data-engine="hls">HLS.js</button><select id="quality" hidden><option value="auto">Quality: Auto</option></select><button id="copy">Copy URL</button></div><div class="message" id="message"></div></div></div><footer>Shaka Player · HLS.js</footer><script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script><script src="https://cdn.jsdelivr.net/npm/shaka-player@latest/dist/shaka-player.compiled.js"></script><script>
const API_URL='https://www.livexo.fun/_serverFn/58cc944e009b93d71a438cdb2467b608efc8ed2deefd40556a2ac8d644bfd476?payload=%7B%22t%22%3A%7B%22t%22%3A10%2C%22i%22%3A0%2C%22p%22%3A%7B%22k%22%3A%5B%22data%22%5D%2C%22v%22%3A%5B%7B%22t%22%3A10%2C%22i%22%3A1%2C%22p%22%3A%7B%22k%22%3A%5B%22fresh%22%5D%2C%22v%22%3A%5B%7B%22t%22%3A2%2C%22s%22%3A3%7D%5D%7D%2C%22o%22%3A0%7D%5D%7D%2C%22o%22%3A0%7D%2C%22f%22%3A127%2C%22m%22%3A%5B%5D%7D';
const $=id=>document.getElementById(id), video=$('video'), labels={today:'আজকের ম্যাচ',live:'Live',upcoming:'Upcoming',willow:'🏏 Willow',sony:'📺 Sony',star:'⭐ Star Sports',otherTv:'📡 Sky / TNT / TV',all:'সব ম্যাচ'};let data=[],tab='today',current=null,engine='auto',hls=null,sp=null,session=0;window.shaka?.polyfill.installAll();
function decodeTSS(root){const refs=new Map();function d(n){if(!n||typeof n!=='object')return n;if(Array.isArray(n))return n.map(d);if([0,1,2].includes(n.t))return n.s;if(n.t===9){const a=[];refs.set(n.i,a);for(const v of n.a||[])a.push(d(v));return a}if([10,11].includes(n.t)){const o={};refs.set(n.i,o);(n.p?.k||[]).forEach((k,i)=>o[k]=d(n.p.v[i]));return o}if(n.r!==undefined&&refs.has(n.r))return refs.get(n.r);if(n.i!==undefined&&refs.has(n.i))return refs.get(n.i);return n}return d(root)}
function today(n){const x=new Date(),m=x.toLocaleString('en',{month:'short'}),d=x.getDate(),dd=String(d).padStart(2,'0'),mm=String(x.getMonth()+1).padStart(2,'0'),y=x.getFullYear();return [`${d} ${m} ${y}`,`${dd} ${m} ${y}`,`${y}-${mm}-${dd}`,`${dd}-${mm}-${y}`].some(t=>n.toLowerCase().includes(t.toLowerCase()))}
function filtered(k){return data.filter(c=>{const n=String(c.name||''),s=n+' '+c.section+' '+(c.group||'');return ({today:()=>today(n),live:()=>/\[LIVE\]/i.test(n),upcoming:()=>/\[UPCOMING\]/i.test(n),willow:()=>/willow/i.test(s),sony:()=>/sony|ten\s*[1-5]/i.test(s),star:()=>/star\s*sports|star\s*select/i.test(s),otherTv:()=>/sky\s*sports|tnt|bt\s*sport|t\s*sports|ptv|astro|fox\s*cricket|supersport|bein|espn|dazn|geo\s*super|a\s*sports/i.test(s),all:()=>true})[k]()})}
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text)e.textContent=text;return e}function logo(src){const b=el('div','logo','🏆');if(src){const i=new Image();i.alt='';i.loading='lazy';i.onload=()=>{b.textContent='';b.append(i)};i.src=src}return b}function team(n,l,right=false){const t=el('div','team'+(right?' right':''));t.append(logo(l),el('div','team-name',n));return t}
function render(){$('tabs').replaceChildren();for(const k of Object.keys(labels)){const b=el('button',k===tab?'active':'',labels[k]+' '+filtered(k).length);b.onclick=()=>{tab=k;render()};$('tabs').append(b)}const q=$('search').value.toLowerCase(),list=filtered(tab).filter(c=>(c.name+' '+c.section+' '+(c.group||'')).toLowerCase().includes(q));$('matches').replaceChildren();if(!list.length)$('matches').append(el('div','empty','এই বিভাগে কোনো ম্যাচ বা চ্যানেল পাওয়া যায়নি।'));for(const c of list){const a=el('article','card'),body=el('div','card-body'),center=el('div','center'),live=/\[LIVE\]/i.test(c.name),up=/\[UPCOMING\]/i.test(c.name);a.tabIndex=0;a.setAttribute('role','button');a.append(el('div','card-header',c.league?.name||c.league||c.section||c.group||'Sports'));if(live)center.append(el('span','dot','●'),el('span','','LIVE'));else{center.textContent=up?'UPCOMING':today(c.name)?'TODAY':'▶ PLAY';center.style.color='#9ca3af'}const n=String(c.name||'Untitled event').replace(/\[(LIVE|UPCOMING)\]/gi,'').trim(),parts=n.split(/\s+(?:vs\.?|versus)\s+/i);if(parts.length===2){body.append(team(parts[0],c.team1_logo),center,team(parts[1],c.team2_logo,true))}else{const t=team(n,c.logo);t.classList.add('single');body.append(t,center)}a.append(body);a.onclick=()=>open(c);a.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open(c)}};$('matches').append(a)}}
async function load(){ $('status').textContent='API থেকে ডেটা আনা হচ্ছে...';try{const r=await fetch(API_URL,{cache:'no-store',headers:{Accept:'application/json'}});if(!r.ok)throw Error('HTTP '+r.status);const raw=await r.json(),d=decodeTSS(raw.t&&typeof raw.t==='object'?raw.t:raw),sections=d?.result?.sections||d?.sections||d?.data?.result?.sections;if(!Array.isArray(sections))throw Error('API response format');const seen=new Set();data=sections.flatMap(s=>(s.channels||[]).map(c=>({...c,section:s.label||''}))).filter(c=>{const k=[c.id,c.name,c.url].join('|');if(seen.has(k))return false;seen.add(k);return true});$('status').textContent='সর্বশেষ আপডেট: '+new Date().toLocaleString('bn-BD')+' · মোট '+data.length+' টি স্ট্রিম';render()}catch(e){$('status').textContent='ডেটা লোড হয়নি: '+e.message;if(!data.length)render()}}
async function stop(){if(hls){hls.destroy();hls=null}if(sp){const p=sp;sp=null;try{await p.destroy()}catch{}}video.pause();video.removeAttribute('src');video.load();$('quality').hidden=true;$('quality').onchange=null}function msg(t){$('message').textContent=t}function quality(items,change){const q=$('quality');q.replaceChildren(new Option('Quality: Auto','auto'));items.forEach(([id,n])=>q.add(new Option(n,id)));q.hidden=!items.length;q.onchange=()=>change(q.value)}
async function start(){const id=++session;await stop();if(id!==session||!current)return;const url=String(current.url||'').split('|')[0];if(!/^https?:\/\//i.test(url)){msg('Stream URL নেই বা সঠিক নয়।');return}msg('স্ট্রিম লোড হচ্ছে...');const mode=engine==='auto'?(/\.m3u8/i.test(url)?'hls':/\.mp4/i.test(url)?'native':'shaka'):engine;async function play(m,fallback){if(id!==session)return;try{if(m==='native'){video.src=url;await video.play();msg('Direct Player');return}if(m==='hls'){if(!window.Hls?.isSupported()){if(video.canPlayType('application/vnd.apple.mpegurl'))return play('native',false);throw Error('HLS unsupported')}const p=hls=new Hls();p.on(Hls.Events.MANIFEST_PARSED,()=>{if(id!==session)return;quality(p.levels.map((l,i)=>[i,l.height?l.height+'p':'Level '+(i+1)]),v=>p.currentLevel=v==='auto'?-1:Number(v));msg('HLS.js Player');video.play().catch(()=>{})});p.on(Hls.Events.ERROR,async(_,d)=>{if(d.fatal&&id===session&&hls===p){if(fallback){await stop();await play('shaka',false)}else msg('HLS error: '+d.details)}});p.loadSource(url);p.attachMedia(video);return}if(!window.shaka?.Player.isBrowserSupported())throw Error('Shaka unsupported');const p=sp=new shaka.Player();await p.attach(video);await p.load(url);if(id!==session)return;quality([...new Map(p.getVariantTracks().filter(t=>t.height).map(t=>[t.height,t])).values()].map(t=>[t.id,t.height+'p']),v=>{p.configure({abr:{enabled:v==='auto'}});if(v!=='auto'){const t=p.getVariantTracks().find(t=>String(t.id)===v);if(t)p.selectVariantTrack(t,true)}});msg('Shaka Player');video.play().catch(()=>{})}catch(e){if(id!==session)return;if(fallback){await stop();return play(m==='hls'?'shaka':'hls',false)}msg('স্ট্রিম চালানো যায়নি: '+(e.code||e.message))}}await play(mode,engine==='auto'&&/\.m3u8/i.test(url))}
function open(c){current=c;$('title').textContent=c.name;$('modal').classList.add('open');start()}function close(){session++;current=null;$('modal').classList.remove('open');stop()}$('close').onclick=close;$('modal').onclick=e=>{if(e.target===$('modal'))close()};document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});document.querySelectorAll('[data-engine]').forEach(b=>b.onclick=()=>{engine=b.dataset.engine;document.querySelectorAll('[data-engine]').forEach(x=>x.classList.toggle('active',x===b));if(current)start()});$('copy').onclick=async()=>{if(!current?.url)return;try{await navigator.clipboard.writeText(current.url);msg('URL copied')}catch{msg('Clipboard unavailable')}};$('search').oninput=render;$('refresh').onclick=load;render();load();setInterval(load,300000);
</script></body></html>
