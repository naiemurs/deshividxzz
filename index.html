<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sports Match Center</title>
<style>
:root{color-scheme:dark;--bg:#08111f;--panel:#111e30;--muted:#9fb0c5;--line:#26374d;--accent:#35d39a;--blue:#4ea1ff}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top,#142b45 0,#08111f 45%);color:#f4f7fb;font-family:Arial,"Noto Sans Bengali",sans-serif;min-height:100vh}
header{padding:26px 16px 18px;text-align:center}
h1{margin:0 0 8px;font-size:clamp(24px,5vw,36px)}
.sub{color:var(--muted);font-size:14px}
.wrap{max-width:1120px;margin:auto;padding:0 15px 40px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0 16px}
#search{flex:1;min-width:180px;background:#0e1a2a;border:1px solid var(--line);border-radius:10px;padding:12px 13px;color:white;font-size:15px;outline:none}
button{border:1px solid var(--line);background:#14243a;color:#eaf2ff;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:700;font-size:13px}
button.active{background:var(--accent);color:#062016;border-color:var(--accent)}
#refresh{background:#183c58;border-color:#285d82}
.tabs{display:flex;gap:8px;overflow:auto;padding:2px 0 12px;scrollbar-width:thin}
.tabs button{white-space:nowrap}
.tabs span{opacity:.8;font-size:12px;margin-left:4px}
.status{color:var(--muted);font-size:13px;margin:4px 0 14px;min-height:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:13px}
.card{display:flex;gap:13px;align-items:center;background:linear-gradient(145deg,#15263c,#101b2b);border:1px solid var(--line);border-radius:14px;padding:13px;min-height:102px;cursor:pointer;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-2px);border-color:#4b82ae}
.logo{width:56px;height:56px;flex:0 0 56px;object-fit:contain;background:#0b1523;border-radius:10px;padding:5px}
.no-logo{display:grid;place-items:center;font-size:24px}
.info{min-width:0}
.name{font-size:14px;line-height:1.4;font-weight:700;overflow-wrap:anywhere}
.meta{color:var(--muted);font-size:12px;margin-top:6px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tag{display:inline-block;font-size:10px;font-weight:800;padding:3px 7px;border-radius:20px;background:#24415b;color:#bfe4ff}
.tag.live{background:#5a2029;color:#ffd1d7}
.tag.up{background:#4b3a19;color:#ffe4a3}
.tag.drm{background:#2f2857;color:#d6ccff}
.tag.hdr{background:#4a2b16;color:#ffd4ad}
.empty{grid-column:1/-1;text-align:center;padding:38px 15px;border:1px dashed var(--line);border-radius:14px;color:var(--muted)}
footer{text-align:center;color:#71849c;font-size:12px;padding:25px 12px}
@media(max-width:520px){header{padding-top:20px}.grid{grid-template-columns:1fr}.card{min-height:90px}}

.player-modal{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.86);display:none;align-items:center;justify-content:center;padding:16px}
.player-modal.open{display:flex}
.player-box{width:min(920px,100%);background:#101d2e;border:1px solid #344a63;border-radius:16px;overflow:hidden;box-shadow:0 25px 80px #0009}
.player-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.player-title{font-weight:700;line-height:1.4;font-size:15px}
.close-player{font-size:22px;padding:4px 12px;line-height:1}
.player-video-wrap{background:#000;aspect-ratio:16/9;display:grid;place-items:center;position:relative}
#matchVideo{width:100%;height:100%;max-height:68vh;background:#000}
.player-controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:10px 16px;background:#0c1624;border-bottom:1px solid var(--line)}
.engine-group{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.engine-btn{padding:6px 11px;font-size:12px;border-radius:8px}
.right-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.quality-select{background:#14243a;color:#eaf2ff;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700;outline:none;cursor:pointer}
.copy-btn{padding:6px 10px;font-size:12px;border-radius:8px;background:#1b334f;border-color:#2d5580}
.player-message{padding:13px 16px;color:#dce8f6;line-height:1.6;font-size:13px}
.player-message strong{color:#fff}
.player-note{color:var(--muted);font-size:12px;margin-top:5px}
</style>

<body>
<header>
  <h1>⚽ Sports Match Center</h1>
  <div class="sub">Live Matches · Willow · Sony · Star Sports</div>
</header>
<main class="wrap">
  <div class="toolbar">
    <input id="search" type="search" placeholder="ম্যাচ বা চ্যানেল খুঁজুন (যেমন: Willow, Sony, India)...">

  </div>
  <nav class="tabs" aria-label="Match filters">
    <button class="active" data-tab="today">আজকের ম্যাচ <span id="todayCount">0</span></button>
    <button data-tab="live">Live <span id="liveCount">0</span></button>
    <button data-tab="upcoming">Upcoming <span id="upcomingCount">0</span></button>
    <button data-tab="willow">🏏 Willow <span id="willowCount">0</span></button>
    <button data-tab="sony">📺 Sony <span id="sonyCount">0</span></button>
    <button data-tab="star">⭐ Star Sports <span id="starCount">0</span></button>
    <button data-tab="otherTv">📡 Sky / TNT / TV <span id="otherTvCount">0</span></button>

<div class="player-modal" id="playerModal" role="dialog" aria-modal="true" aria-label="Match player">
  <div class="player-box">
    <div class="player-head">
      <div class="player-title" id="playerTitle">Match Player</div>
      <button class="close-player" id="closePlayer" aria-label="Close player">×</button>
    </div>
    <div class="player-video-wrap">
      <video id="matchVideo" controls playsinline autoplay></video>
    </div>
    <div class="player-controls">
      <div class="engine-group" id="engineGroup">
        <button class="engine-btn active" data-engine="auto">Auto</button>
        <button class="engine-btn" data-engine="shaka">Shaka Player</button>
        <button class="engine-btn" data-engine="hls">HLS.js</button>
      </div>
      <div class="right-controls">
        <select id="qualitySelect" class="quality-select" style="display:none" aria-label="Video quality">
          <option value="auto">Quality: Auto</option>

</div>

<footer>Shaka Player (DASH / ClearKey / HLS) ও HLS.js সাপোর্টেড।</footer>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/shaka-player@latest/dist/shaka-player.compiled.js"></script>

<script>
const API_URL = "https://www.livexo.fun/_serverFn/ee339064acdba3948f70d599f0e92aba29cbcaa59d51b2639fd889c9bf338972";

// যদি Cloudflare Worker বা CORS Proxy থাকে, এখানে বসাতে পারো (উদাহরণ: "https://your-worker.workers.dev/?url=")
const STREAM_PROXY = "";

let hlsPlayer = null;
let shakaPlayer = null;
let currentTab = "today";
let currentChannel = null;
let selectedEngine = "auto";
let matchData = {
  today: [], live: [], upcoming: [],
  willow: [], sony: [], star: [], otherTv: [], all: []
};

if (window.shaka) {
  shaka.polyfill.installAll();
}

function decodeTSS(root) {
  const refs = new Map();
  function decode(node) {
    if (node === null || typeof node !== "object") return node;
    if (Array.isArray(node)) return node.map(decode);
    const type = node.t;
    if (type === 1 || type === 2 || type === 0) return node.s;
    if (type === 9) {
      const arr = [];
      if (node.i !== undefined) refs.set(node.i, arr);
      for (const item of (node.a || [])) arr.push(decode(item));
      return arr;
    }
    if (type === 10 || type === 11) {
      const obj = {};
      if (node.i !== undefined) refs.set(node.i, obj);
      const keys = node.p?.k || [];
      const values = node.p?.v || [];
      keys.forEach((key, index) => { obj[key] = decode(values[index]); });
      return obj;
    }
    if (node.r !== undefined && refs.has(node.r)) return refs.get(node.r);
    if (node.i !== undefined && refs.has(node.i)) return refs.get(node.i);
    return node;
  }
  return decode(root);
}

function todayDateTokens() {
  const now = new Date();
  const dd = String(now.getDate()).padStart(2, "0");
  const yyyy = String(now.getFullYear());
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const month = months[now.getMonth()];
  return [
    `${dd} ${month} ${yyyy}`,
    `${now.getDate()} ${month} ${yyyy}`,
    `${yyyy}-${String(now.getMonth()+1).padStart(2,"0")}-${dd}`,
    `${dd}-${String(now.getMonth()+1).padStart(2,"0")}-${yyyy}`
  ].map(s => s.toLowerCase());
}

function hasTodayDate(name) {
  const lower = (name || "").toLowerCase();
  return todayDateTokens().some(token => lower.includes(token));
}

function classify(data) {
  const result = {
    today: [], live: [], upcoming: [],
    willow: [], sony: [], star: [], otherTv: [], all: []
  };
  const sections = data?.result?.sections || [];

  sections.forEach(section => {
    (section.channels || []).forEach(channel => {
      const name = String(channel.name || "");
      const sectionLabel = String(section.label || "");
      const group = String(channel.group || "");
      const fullText = `${name} ${sectionLabel} ${group}`.toLowerCase();
      const item = { ...channel, section: sectionLabel };

      result.all.push(item);

      if (hasTodayDate(name)) result.today.push(item);
      if (/\[UPCOMING\]/i.test(name)) result.upcoming.push(item);
      if (/\[LIVE\]/i.test(name)) result.live.push(item);

      // আলাদা চ্যানেল ক্যাটাগরি
      if (/willow/i.test(fullText)) {
        result.willow.push(item);
      } else if (/sony|ten\s*[1-5]|sony\s*six|sony\s*liv/i.test(fullText)) {
        result.sony.push(item);
      } else if (/star\s*sports|star\s*select/i.test(fullText)) {
        result.star.push(item);
      } else if (/sky\s*sports|tnt\s*sports|bt\s*sport|t\s*sports|ptv|astro|fox\s*cricket|supersport|bein|espn|dazn|geo\s*super|a\s*sports/i.test(fullText)) {
        result.otherTv.push(item);
      }
    });
  });

  // ডুপ্লিকেট রিমুভ
  for (const key of Object.keys(result)) {
    const seen = new Set();
    result[key] = result[key].filter(item => {
      const id = String(item.id || "") + "|" + String(item.name || "") + "|" + String(item.url || "");
      if (seen.has(id)) return false;
      seen.add(id);
      return true;
    });
  }
  return result;
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}

function render() {
  const query = document.getElementById("search").value.trim().toLowerCase();
  const list = (matchData[currentTab] || []).filter(item =>
    `${item.name || ""} ${item.group || ""} ${item.section || ""}`.toLowerCase().includes(query)
  );

  document.getElementById("todayCount").textContent = matchData.today.length;
  document.getElementById("liveCount").textContent = matchData.live.length;
  document.getElementById("upcomingCount").textContent = matchData.upcoming.length;
  document.getElementById("willowCount").textContent = matchData.willow.length;
  document.getElementById("sonyCount").textContent = matchData.sony.length;
  document.getElementById("starCount").textContent = matchData.star.length;
  document.getElementById("otherTvCount").textContent = matchData.otherTv.length;
  document.getElementById("allCount").textContent = matchData.all.length;

  const container = document.getElementById("matches");
  if (!list.length) {
    container.innerHTML = '<div class="empty">এই বিভাগে কোনো ম্যাচ বা চ্যানেল পাওয়া যায়নি।</div>';
    return;
  }

  container.innerHTML = list.map((item, index) => {
    const name = escapeHTML(item.name || "Untitled event");
    const section = escapeHTML(item.section || item.group || "Sports");
    const logo = item.logo
      ? `<img class="logo" src="${escapeHTML(item.logo)}" alt="" loading="lazy" onerror="this.style.display='none'">`
      : '<div class="logo no-logo">🏆</div>';

    const tags = [];
    if (/\[LIVE\]/i.test(item.name || "")) tags.push('<span class="tag live">● LIVE</span>');
    else if (/\[UPCOMING\]/i.test(item.name || "")) tags.push('<span class="tag up">UPCOMING</span>');
    else if (hasTodayDate(item.name || "")) tags.push('<span class="tag">TODAY</span>');

    if (item.key && item.key !== 0 && item.key !== "0") tags.push('<span class="tag drm">DRM</span>');
    if (String(item.url || "").includes("|")) tags.push('<span class="tag hdr">HEADER</span>');

    return `<article class="card" data-match-index="${index}" tabindex="0" role="button" aria-label="Open ${name}">
      ${logo}
      <div class="info">
        <div class="name">${name}</div>
        <div class="meta">${section}</div>
        <div class="tags">${tags.join("")}</div>
      </div>
    </article>`;
  }).join("");

  container.querySelectorAll("[data-match-index]").forEach(card => {
    const open = () => openMatchPlayer(list[Number(card.dataset.matchIndex)]);
    card.addEventListener("click", open);
    card.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        open();
      }
    });
  });
}

function resetQualityMenu() {
  const select = document.getElementById("qualitySelect");
  select.innerHTML = '<option value="auto">Quality: Auto</option>';
  select.style.display = "none";
  select.onchange = null;
}

async function stopPlayer() {
  resetQualityMenu();
  const video = document.getElementById("matchVideo");
  try { video.pause(); } catch (_) {}

  if (hlsPlayer) {
    try { hlsPlayer.destroy(); } catch (_) {}
    hlsPlayer = null;
  }
  if (shakaPlayer) {
    try { await shakaPlayer.destroy(); } catch (_) {}
    shakaPlayer = null;
  }

  video.removeAttribute("src");
  video.load();
}

async function closeMatchPlayer() {
  currentChannel = null;
  await stopPlayer();
  document.getElementById("playerModal").classList.remove("open");
}

function showPlayerMessage(message) {
  document.getElementById("playerMessage").innerHTML = message;
}

// Base64url বা Hex দুই ফরম্যাটের Key-কেই Hex-এ কনভার্ট করবে
function toHexKey(str) {
  const cleaned = String(str || "").trim().replace(/-/g, "");
  if (/^[0-9a-fA-F]{32}$/.test(cleaned)) return cleaned.toLowerCase();
  try {
    let b64 = cleaned.replace(/-/g, "+").replace(/_/g, "/");
    while (b64.length % 4) b64 += "=";
    const bin = atob(b64);
    let hex = "";
    for (let i = 0; i < bin.length; i++) {
      hex += bin.charCodeAt(i).toString(16).padStart(2, "0");
    }
    return hex.toLowerCase();
  } catch (_) {
    return cleaned.toLowerCase();
  }
}

function parseClearKeys(channel) {
  const rawKey = channel.key ?? channel.clearKey ?? channel.clearkey ?? channel.drm;
  if (!rawKey || rawKey === 0 || rawKey === "0") return null;

  const clearKeys = {};
  if (typeof rawKey === "string") {
    const trimmed = rawKey.trim();
    if (!trimmed) return null;

    if (trimmed.startsWith("{")) {
      try {
        const parsed = JSON.parse(trimmed);
        for (const [k, v] of Object.entries(parsed)) {
          if (k && v) clearKeys[toHexKey(k)] = toHexKey(v);
        }
        return Object.keys(clearKeys).length ? clearKeys : null;
      } catch (_) {}
    }

    trimmed.split(/[,;\n]+/).forEach(pair => {
      const parts = pair.split(":");
      if (parts.length === 2) {
        const kid = toHexKey(parts[0]);
        const key = toHexKey(parts[1]);
        if (kid && key) clearKeys[kid] = key;
      }
    });
  } else if (typeof rawKey === "object") {
    if (rawKey.kid && rawKey.key) {
      clearKeys[toHexKey(rawKey.kid)] = toHexKey(rawKey.key);
    } else if (rawKey.keyId && rawKey.key) {
      clearKeys[toHexKey(rawKey.keyId)] = toHexKey(rawKey.key);
    } else {
      for (const [k, v] of Object.entries(rawKey)) {
        if (typeof v === "string") clearKeys[toHexKey(k)] = toHexKey(v);
      }
    }
  }

  return Object.keys(clearKeys).length ? clearKeys : null;
}

function parseStreamInfo(channel) {
  const raw = String(channel.url || "").trim();
  if (!raw) return { ok: false, reason: "এই ম্যাচের API ডেটায় কোনো stream URL নেই।" };

  const hasPipeHeaders = raw.includes("|");
  let cleanUrl = raw.split("|")[0].trim();

  try { new URL(cleanUrl); }
  catch (_) { return { ok: false, reason: "Stream URL সঠিক নয়।" }; }

  const lower = cleanUrl.toLowerCase();
  const clearKeys = parseClearKeys(channel);

  let format = "unknown";
  if (lower.includes(".mpd")) format = "dash";
  else if (lower.includes(".m3u8")) format = "hls";
  else if (lower.includes(".mp4")) format = "mp4";

  const finalUrl = STREAM_PROXY ? (STREAM_PROXY + encodeURIComponent(cleanUrl)) : cleanUrl;

  return { ok: true, url: finalUrl, rawUrl: raw, format, clearKeys, hasPipeHeaders };
}

async function playWithShaka(video, info, allowFallback = false) {
  if (!window.shaka || !shaka.Player.isBrowserSupported()) {
    showPlayerMessage("এই ব্রাউজারে Shaka Player সাপোর্টেড নয়।");
    return;
  }

  shakaPlayer = new shaka.Player();
  await shakaPlayer.attach(video);

  shakaPlayer.addEventListener("error", event => {
    const err = event.detail;
    console.error("Shaka Error:", err);
    showPlayerMessage(`<strong>Shaka Error (${err.code}):</strong> ব্রাউজারে স্ট্রিমটি ব্লক হয়েছে (CORS / Header)। নিচে থেকে <b>Copy URL</b> করে VLC-তে দেখতে পারেন।`);
  });

  const config = {
    streaming: { bufferingGoal: 20, rebufferingGoal: 2 }
  };
  if (info.clearKeys) {
    config.drm = { clearKeys: info.clearKeys };
  }
  shakaPlayer.configure(config);

  try {
    await shakaPlayer.load(info.url);
    setupShakaQuality();
    const drmLabel = info.clearKeys ? " (ClearKey DRM)" : "";
    const headerNote = info.hasPipeHeaders ? '<div class="player-note">নোট: এই স্ট্রিমে কাস্টম Header আছে। না চললে Copy URL করে VLC/NS Player-এ চালান।</div>' : "";
    showPlayerMessage(`<strong>Shaka Player</strong> চালু হয়েছে${drmLabel}।${headerNote}`);
    video.play().catch(() => {});
  } catch (err) {
    console.error("Shaka Load Error:", err);
    if (allowFallback && info.format === "hls") {
      await stopPlayer();
      playWithHls(video, info, false);
      return;
    }
    showPlayerMessage(`<strong>স্ট্রিম লোড হয়নি (Code: ${err.code || "N/A"})।</strong><div class="player-note">এই লিংকটিতে CORS বা Referer/User-Agent হেডার ব্লক আছে। উপরের <b>Copy URL</b> বাটনে ক্লিক করে VLC-তে টেস্ট করুন।</div>`);
  }
}

function setupShakaQuality() {
  if (!shakaPlayer) return;
  const tracks = shakaPlayer.getVariantTracks().filter(t => t.type === "variant" && t.height);
  if (!tracks.length) return;

  const uniqueHeights = [...new Map(tracks.map(t => [t.height, t])).values()]
    .sort((a, b) => b.height - a.height);

  const select = document.getElementById("qualitySelect");
  select.innerHTML = '<option value="auto">Quality: Auto</option>';
  uniqueHeights.forEach(track => {
    const opt = document.createElement("option");
    opt.value = track.id;
    opt.textContent = `${track.height}p`;
    select.appendChild(opt);
  });
  select.style.display = "block";

  select.onchange = () => {
    if (!shakaPlayer) return;
    if (select.value === "auto") {
      shakaPlayer.configure({ abr: { enabled: true } });
    } else {
      const target = shakaPlayer.getVariantTracks().find(t => String(t.id) === select.value);
      if (target) {
        shakaPlayer.configure({ abr: { enabled: false } });
        shakaPlayer.selectVariantTrack(target, true);
      }
    }
  };
}

function playWithHls(video, info, allowFallback = false) {
  const headerNote = info.hasPipeHeaders ? '<div class="player-note">নোট: এই স্ট্রিমে কাস্টম Header আছে।</div>' : "";

  if (window.Hls && Hls.isSupported()) {
    hlsPlayer = new Hls({ enableWorker: true, lowLatencyMode: true });
    hlsPlayer.loadSource(info.url);
    hlsPlayer.attachMedia(video);

    hlsPlayer.on(Hls.Events.MANIFEST_PARSED, (_, data) => {
      setupHlsQuality(data.levels || []);
      showPlayerMessage(`<strong>HLS.js Player</strong> চালু হয়েছে।${headerNote}`);
      video.play().catch(() => {});
    });

    hlsPlayer.on(Hls.Events.ERROR, async (_, data) => {
      if (data.fatal) {
        if (allowFallback) {
          await stopPlayer();
          await playWithShaka(video, info, false);
          return;
        }
        showPlayerMessage(`<strong>HLS.js Error:</strong> স্ট্রিম চালানো যায়নি (${escapeHTML(data.details || "CORS/Network")})। <b>Copy URL</b> করে VLC-তে দেখুন।`);
      }
    });
  } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
    video.src = info.url;
    showPlayerMessage(`<strong>Native HLS Player</strong> চালু হয়েছে।${headerNote}`);
    video.play().catch(() => {});
  } else {
    playWithShaka(video, info, false);
  }
}

function setupHlsQuality(levels) {
  if (!hlsPlayer || !levels.length) return;
  const select = document.getElementById("qualitySelect");
  select.innerHTML = '<option value="auto">Quality: Auto</option>';

  levels.forEach((level, idx) => {
    const opt = document.createElement("option");
    opt.value = idx;
    opt.textContent = level.height ? `${level.height}p` : `Level ${idx + 1}`;
    select.appendChild(opt);
  });
  select.style.display = "block";

  select.onchange = () => {
    if (!hlsPlayer) return;
    hlsPlayer.currentLevel = select.value === "auto" ? -1 : Number(select.value);
  };
}

async function startPlayback(channel, engineMode = selectedEngine) {
  await stopPlayer();
  const video = document.getElementById("matchVideo");
  const info = parseStreamInfo(channel);

  if (!info.ok) {
    showPlayerMessage(`<strong>ভিডিও চালানো যাচ্ছে না:</strong> ${escapeHTML(info.reason)}`);
    return;
  }

  showPlayerMessage("স্ট্রিম লোড হচ্ছে...");

  if (info.format === "mp4" && engineMode === "auto") {
    video.src = info.url;
    showPlayerMessage("<strong>Direct MP4 Player</strong> চালু হয়েছে।");
    video.play().catch(() => {});
    return;
  }

  if (engineMode === "auto") {
    if (info.format === "dash" || info.clearKeys) {
      await playWithShaka(video, info, false);
    } else if (info.format === "hls") {
      playWithHls(video, info, true);
    } else {
      await playWithShaka(video, info, true);
    }
  } else if (engineMode === "shaka") {
    await playWithShaka(video, info, false);
  } else {
    playWithHls(video, info, false);
  }
}

async function openMatchPlayer(channel) {
  currentChannel = channel;
  const modal = document.getElementById("playerModal");
  document.getElementById("playerTitle").textContent = channel.name || "Match Player";
  modal.classList.add("open");
  await startPlayback(channel, selectedEngine);
}

// Copy URL button
document.getElementById("copyUrlBtn").addEventListener("click", async () => {
  if (!currentChannel?.url) return;
  try {
    await navigator.clipboard.writeText(currentChannel.url);
    const btn = document.getElementById("copyUrlBtn");
    btn.textContent = "✓ Copied!";
    setTimeout(() => { btn.textContent = "📋 Copy URL"; }, 1800);
  } catch (_) {
    alert(currentChannel.url);
  }
});

// Engine switch buttons
document.querySelectorAll("[data-engine]").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("[data-engine]").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    selectedEngine = btn.dataset.engine;
    if (currentChannel) startPlayback(currentChannel, selectedEngine);
  });
});

document.getElementById("closePlayer").addEventListener("click", closeMatchPlayer);
document.getElementById("playerModal").addEventListener("click", event => {
  if (event.target.id === "playerModal") closeMatchPlayer();
});
document.addEventListener("keydown", event => {
  if (event.key === "Escape") closeMatchPlayer();
});

async function loadMatches() {
  const status = document.getElementById("status");
  status.textContent = "API থেকে ডেটা আনা হচ্ছে...";
  document.getElementById("matches").innerHTML = "";
  try {
    const response = await fetch(API_URL, {
      method: "GET",
      headers: {"Accept":"application/json"},
      cache: "no-store"
    });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const raw = await response.json();
    const decoded = decodeTSS(raw);
    if (!decoded?.result?.sections) throw new Error("API response format পাওয়া যায়নি");
    matchData = classify(decoded);
    status.textContent = `সর্বশেষ আপডেট: ${new Date().toLocaleString("bn-BD")} · মোট ${matchData.all.length} টি স্ট্রিম`;
    render();
  } catch (error) {
    console.error(error);
    status.textContent = "ডেটা লোড হয়নি: " + error.message;
    document.getElementById("matches").innerHTML =
      '<div class="empty">API থেকে ডেটা পাওয়া যায়নি। CORS ব্লক হলে API proxy ব্যবহার করতে হবে।</div>';
  }
}

document.querySelectorAll("[data-tab]").forEach(button => {
  button.addEventListener("click", () => {
    document.querySelectorAll("[data-tab]").forEach(b => b.classList.remove("active"));
    button.classList.add("active");
    currentTab = button.dataset.tab;
    render();
  });
});
document.getElementById("search").addEventListener("input", render);
document.getElementById("refresh").addEventListener("click", loadMatches);

loadMatches();
setInterval(loadMatches, 5 * 60 * 1000);
</script>
